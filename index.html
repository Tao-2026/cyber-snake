<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSnake - Neon Arcade Game</title>
<style>
body {
  margin: 0; padding: 0; background-color: #0d0e15; color: #00ffcc;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.game-container { display: flex; flex-direction: column; align-items: center; position: relative; }
h1 {
  font-size: 2.5rem; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 4px; color: #fff;
  text-shadow: 0 0 5px #fff, 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 4px #00ffcc;
}
.score-board { font-size: 1.2rem; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; color: #ff007f; text-shadow: 0 0 8px #ff007f; }
canvas { background-color: #141622; border: 4px solid #00ffcc; box-shadow: 0 0 20px #00ffcc, inset 0 0 15px rgba(0, 255, 204, 0.2); border-radius: 8px; }
.button-controls { margin-top: 15px; display: flex; gap: 15px; }
.overlay {
  position: absolute; top: 85px; width: 400px; height: 400px; background: rgba(13, 14, 21, 0.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; z-index: 10; transition: all 0.3s ease;
}
.hidden { display: none !important; opacity: 0; pointer-events: none; }
.game-over-text { color: #ff007f; font-size: 2rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 10px #ff007f; }
.cyber-btn {
  background: transparent; color: #00ffcc; border: 2px solid #00ffcc; padding: 12px 30px; font-size: 1.1rem;
  font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 4px;
  position: relative; overflow: hidden; transition: all 0.2s ease; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
}
.cyber-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; text-shadow: none; }
.cyber-btn:active { transform: scale(0.95); }
.cyber-btn.pause-style { color: #ffaa00; border-color: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.3); }
.cyber-btn.pause-style:hover { background: #ffaa00; color: #000; box-shadow: 0 0 20px #ffaa00; }
.controls-tip { margin-top: 15px; font-size: 0.85rem; color: #64748b; text-align: center; }
</style>
</head>
<body>
<div class="game-container">
  <h1>Cyber Snake</h1>
  <div class="score-board">SCORE: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="gameOverlay" class="overlay">
    <div id="gameOverMessage" class="game-over-text hidden">GAME OVER</div>
    <button id="actionBtn" class="cyber-btn">START GAME</button>
  </div>
  <div class="button-controls">
    <button id="pauseBtn" class="cyber-btn pause-style">PAUSE</button>
  </div>
  <div class="controls-tip">
    Use arrow keys (↑ ↓ ← →) to steer the snake<br>
    Press <strong>Spacebar</strong> or click PAUSE to freeze time
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const overlay = document.getElementById('gameOverlay');
const gameOverMessage = document.getElementById('gameOverMessage');
const actionBtn = document.getElementById('actionBtn');
const pauseBtn = document.getElementById('pauseBtn');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [];
let food = { x: 0, y: 0 };
let dx = gridSize;
let dy = 0;
let score = 0;
let gameLoopInterval = null;
let isGameRunning = false;
let isPaused = false;
let gameSpeed = 100;
let changingDirection = false;

function initGame() {
  snake = [
    { x: gridSize * 5, y: gridSize * 5 },
    { x: gridSize * 4, y: gridSize * 5 },
    { x: gridSize * 3, y: gridSize * 5 }
  ];
  dx = gridSize; dy = 0; score = 0;
  scoreElement.textContent = score;
  changingDirection = false;
  isPaused = false;
  pauseBtn.textContent = 'PAUSE';
  generateFood();
}

function generateFood() {
  food.x = Math.floor(Math.random() * tileCount) * gridSize;
  food.y = Math.floor(Math.random() * tileCount) * gridSize;
  snake.forEach(part => {
    if (part.x === food.x && part.y === food.y) generateFood();
  });
}

function mainLoop() {
  if (isPaused) return;
  if (hasGameEnded()) { endGame(); return; }
  changingDirection = false;
  clearCanvas(); drawFood(); moveSnake(); drawSnake();
}

function clearCanvas() {
  ctx.fillStyle = '#141622';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawSnake() {
  snake.forEach((part, index) => {
    ctx.fillStyle = (index === 0) ? '#00ffcc' : '#00b3ff';
    ctx.shadowBlur = (index === 0) ? 12 : 6;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
  });
  ctx.shadowBlur = 0;
}

// 修复了这里原本缺少 [0] 导致的逻辑错误
function drawFood() {
  ctx.fillStyle = '#ff007f'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff007f';
  ctx.fillRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);
  ctx.shadowBlur = 0;
}

function moveSnake() {
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  snake.unshift(head);
  if (snake[0].x === food.x && snake[0].y === food.y) {
    score += 10; scoreElement.textContent = score; generateFood();
  } else {
    snake.pop();
  }
}

function hasGameEnded() {
  for (let i = 4; i < snake.length; i++) {
    if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
  }
  return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
}

function togglePause() {
  if (!isGameRunning) return;
  isPaused = !isPaused;
  if (isPaused) {
    pauseBtn.textContent = 'RESUME';
    ctx.fillStyle = 'rgba(13, 14, 21, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 2rem sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  } else {
    pauseBtn.textContent = 'PAUSE';
  }
}

function handleKeyPress(event) {
  if (event.keyCode === 32) { event.preventDefault(); togglePause(); return; }
  if (changingDirection || isPaused) return;
  const keyPressed = event.keyCode;
  if (keyPressed === 37 && dx !== gridSize) { dx = -gridSize; dy = 0; changingDirection = true; }
  if (keyPressed === 38 && dy !== gridSize) { dx = 0; dy = -gridSize; changingDirection = true; }
  if (keyPressed === 39 && dx !== -gridSize) { dx = gridSize; dy = 0; changingDirection = true; }
  if (keyPressed === 40 && dy !== -gridSize) { dx = 0; dy = gridSize; changingDirection = true; }
}

function startGame() {
  initGame(); isGameRunning = true;
  gameOverMessage.classList.add('hidden'); overlay.classList.add('hidden');
  if (gameLoopInterval) clearInterval(gameLoopInterval);
  gameLoopInterval = setInterval(mainLoop, gameSpeed);
}

function endGame() {
  clearInterval(gameLoopInterval); isGameRunning = false;
  gameOverMessage.classList.remove('hidden'); actionBtn.textContent = 'RESTART'; overlay.classList.remove('hidden');
}

actionBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
document.addEventListener('keydown', handleKeyPress);
clearCanvas();
</script>
</body>
</html>
