<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <meta name="description" content="Cyber Snake — 一款支持键盘与触屏的赛博朋克贪吃蛇游戏。">
  <title>Cyber Snake // Neon Protocol</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">ARCADE SYSTEM // 001</p>
        <h1>CYBER <em>SNAKE</em></h1>
      </div>
      <div class="system-state"><i></i><span id="systemState">SYSTEM READY</span></div>
    </header>

    <section class="game-layout" aria-label="Cyber Snake 游戏">
      <aside class="panel stats-panel" aria-label="游戏数据">
        <div class="panel-label">RUN DATA</div>
        <div class="stat"><span>SCORE</span><strong id="score">0000</strong></div>
        <div class="stat"><span>HIGH SCORE</span><strong id="highScore">0000</strong></div>
        <div class="stat"><span>SPEED</span><strong id="speed">01</strong></div>
        <div class="divider"></div>
        <p class="microcopy">吞噬数据核心以增长。速度会随分数提升。</p>
      </aside>

      <section class="arena-wrap">
        <div class="corner corner-a" aria-hidden="true"></div>
        <div class="corner corner-b" aria-hidden="true"></div>
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="gameCanvas" width="600" height="600" tabindex="0" aria-label="贪吃蛇游戏区域。按开始游戏，然后使用方向键或 WASD 控制。"></canvas>
          <div class="scanlines" aria-hidden="true"></div>
          <div id="gameOverlay" class="overlay">
            <p id="overlayKicker" class="overlay-kicker">NEURAL LINK READY</p>
            <h2 id="overlayTitle">CYBER SNAKE</h2>
            <p id="overlayText">接入霓虹网络，收集数据核心。</p>
            <button id="primaryBtn" class="btn btn-primary" type="button">开始游戏</button>
          </div>
        </div>
        <p id="liveStatus" class="sr-only" aria-live="polite">游戏待开始</p>
      </section>

      <aside class="panel controls-panel" aria-label="操作说明">
        <div class="panel-label">CONTROLS</div>
        <div class="key-grid" aria-hidden="true">
          <span></span><kbd>W</kbd><span></span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </div>
        <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 WASD 移动</p>
        <p><kbd>Space</kbd> 暂停 / 继续</p>
        <div class="divider"></div>
        <button id="pauseBtn" class="btn btn-secondary" type="button" disabled>暂停</button>
        <button id="restartBtn" class="btn btn-ghost" type="button">重新开始</button>
      </aside>
    </section>

    <nav class="touch-controls" aria-label="触屏方向控制">
      <button type="button" data-direction="up" aria-label="向上">▲</button>
      <button type="button" data-direction="left" aria-label="向左">◀</button>
      <button type="button" data-direction="down" aria-label="向下">▼</button>
      <button type="button" data-direction="right" aria-label="向右">▶</button>
    </nav>

    <footer><span>ARROWS / WASD / SWIPE</span><span>SPACE TO PAUSE</span><span>LOCAL HIGH SCORE ENABLED</span></footer>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
