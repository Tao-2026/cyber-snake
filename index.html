<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSnake - Neon Arcade Game</title>
<style>
/* Cyberpunk dark background setup */
body {
  margin: 0;
  padding: 0;
  background-color: #0d0e15;
  color: #00ffcc;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
/* Core container layout */
.game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
/* Glowing text effect for title */
h1 {
  font-size: 2.5rem;
  margin: 0 0 10px 0;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #fff;
  text-shadow: 0 0 5px #fff, 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 4px #00ffcc;
}
/* Score elements styling */
.score-board {
  font-size: 1.2rem;
  margin-bottom: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #ff007f;
  text-shadow: 0 0 8px #ff007f;
}
/* Canvas window with neon glow borders */
canvas {
  background-color: #141622;
  border: 4px solid #00ffcc;
  box-shadow: 0 0 20px #00ffcc, inset 0 0 15px rgba(0, 255, 204, 0.2);
  border-radius: 8px;
}
/* Interactive overlay container for start/end screens */
.overlay {
  position: absolute;
  top: 85px;
  width: 400px;
  height: 400px;
  background: rgba(13, 14, 21, 0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  z-index: 10;
  transition: all 0.3s ease;
}
.hidden {
  display: none !important;
  opacity: 0;
  pointer-events: none;
}
/* Warning text style for game over message */
.game-over-text {
  color: #ff007f;
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 20px;
  text-transform: uppercase;
  text-shadow: 0 0 10px #ff007f;
}
/* Futuristic cyberpunk action buttons */
.cyber-btn {
  background: transparent;
  color: #00ffcc;
  border: 2px solid #00ffcc;
  padding: 12px 30px;
  font-size: 1.1rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
  box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
}
.cyber-btn:hover {
  background: #00ffcc;
  color: #000;
  box-shadow: 0 0 20px #00ffcc;
  text-shadow: none;
}
.cyber-btn:active {
  transform: scale(0.95);
}
/* Bottom hint layout rules */
.controls-tip {
  margin-top: 15px;
  font-size: 0.85rem;
  color: #64748b;
}
</style>
</head>
<body>
<div class="game-container">
  <h1>Cyber Snake</h1>
  <div class="score-board">SCORE: <span id="score">0</span></div>
  <!-- Render context box -->
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <!-- Active interactive ui box -->
  <div id="gameOverlay" class="overlay">
    <div id="gameOverMessage" class="game-over-text hidden">GAME OVER</div>
    <button id="actionBtn" class="cyber-btn">START GAME</button>
  </div>
  <div class="controls-tip">Use arrow keys (↑ ↓ ← →) to steer the snake</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const overlay = document.getElementById('gameOverlay');
const gameOverMessage = document.getElementById('gameOverMessage');
const actionBtn = document.getElementById('actionBtn');

// Layout metrics configuration
const gridSize = 20;
const tileCount = canvas.width / gridSize;

// Core system states
let snake = [];
let food = { x: 0, y: 0 };
let dx = gridSize;
let dy = 0;
let score = 0;
let gameLoopInterval = null;
let isGameRunning = false;
let gameSpeed = 100;
let changingDirection = false;

// Reset runtime values
function initGame() {
  snake = [
    { x: gridSize * 5, y: gridSize * 5 },
    { x: gridSize * 4, y: gridSize * 5 },
    { x: gridSize * 3, y: gridSize * 5 }
  ];
  dx = gridSize;
  dy = 0;
  score = 0;
  scoreElement.textContent = score;
  changingDirection = false;
  generateFood();
}

// Relocate item coordinate arrays
function generateFood() {
  food.x = Math.floor(Math.random() * tileCount) * gridSize;
  food.y = Math.floor(Math.random() * tileCount) * gridSize;
  
  // Loop check to prevent item collision with snake nodes
  snake.forEach(part => {
    const hasEaten = part.x === food.x && part.y === food.y;
    if (hasEaten) generateFood();
  });
}

// System tick runner loop
function mainLoop() {
  if (hasGameEnded()) {
    endGame();
    return;
  }
  changingDirection = false;
  clearCanvas();
  drawFood();
  moveSnake();
  drawSnake();
}

// Full screen reset pass
function clearCanvas() {
  ctx.fillStyle = '#141622';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Render snake elements with neon filter rules
function drawSnake() {
  snake.forEach((part, index) => {
    if (index === 0) {
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00ffcc';
    } else {
      ctx.fillStyle = '#00b3ff';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#00b3ff';
    }
    ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
  });
  ctx.shadowBlur = 0;
}

// Render target node item points
function drawFood() {
  ctx.fillStyle = '#ff007f';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff007f';
  ctx.fillRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);
  ctx.shadowBlur = 0;
}

// Main positional offsets calculation and append logics
function moveSnake() {
  // FIXED: Targeted snake[0] arrays instead of undefined snake object properties
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  snake.unshift(head);
  const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
  if (hasEatenFood) {
    score += 10;
    scoreElement.textContent = score;
    generateFood();
  } else {
    snake.pop();
  }
}

// Boundary state checking functions
function hasGameEnded() {
  // FIXED: Adjusted references to track snake[0] index explicitly
  for (let i = 4; i < snake.length; i++) {
    if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
  }
  const hitLeftWall = snake[0].x < 0;
  const hitRightWall = snake[0].x >= canvas.width;
  const hitTopWall = snake[0].y < 0;
  const hitBottomWall = snake[0].y >= canvas.height;
  return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
}

// Input listener handles
function handleKeyPress(event) {
  const LEFT_KEY = 37;
  const UP_KEY = 38;
  const RIGHT_KEY = 39;
  const DOWN_KEY = 40;
  
  if (changingDirection) return;
  const keyPressed = event.keyCode;
  const goingUp = dy === -gridSize;
  const goingDown = dy === gridSize;
  const goingRight = dx === gridSize;
  const goingLeft = dx === -gridSize;
  
  if (keyPressed === LEFT_KEY && !goingRight) {
    dx = -gridSize;
    dy = 0;
    changingDirection = true;
  }
  if (keyPressed === UP_KEY && !goingDown) {
    dx = 0;
    dy = -gridSize;
    changingDirection = true;
  }
  if (keyPressed === RIGHT_KEY && !goingLeft) {
    dx = gridSize;
    dy = 0;
    changingDirection = true;
  }
  if (keyPressed === DOWN_KEY && !goingUp) {
    dx = 0;
    dy = gridSize;
    changingDirection = true;
  }
}

// Runtime initializer trigger handler
function startGame() {
  initGame();
  isGameRunning = true;
  gameOverMessage.classList.add('hidden'); // Clear out Game Over header text if restarting
  overlay.classList.add('hidden');
  if (gameLoopInterval) clearInterval(gameLoopInterval); // Clear any lingering loops
  gameLoopInterval = setInterval(mainLoop, gameSpeed);
}

// Graceful breakdown loop end engine state
function endGame() {
  clearInterval(gameLoopInterval);
  isGameRunning = false;
  gameOverMessage.classList.remove('hidden');
  actionBtn.textContent = 'RESTART';
  overlay.classList.remove('hidden');
}

// Initialize system events
actionBtn.addEventListener('click', startGame);
document.addEventListener('keydown', handleKeyPress);

// Initial paint clear setup
clearCanvas();
</script>
</body>
</html>
